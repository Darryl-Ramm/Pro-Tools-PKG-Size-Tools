name: release
on:
    release:
        types: [published]
permissions:
    contents: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build tarball and upload
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  NAME="${{ github.event.repository.name }}-$VERSION"
                  mkdir -p "dist/$NAME"
                  git ls-files | grep -v '^\.github/' | while IFS= read -r f; do
                      mkdir -p "dist/$NAME/$(dirname "$f")"
                      cp -p "$f" "dist/$NAME/$f"
                      if grep -q '@@VERSION@@' "$f"; then
                          sed -i "s/@@VERSION@@/$VERSION/g" "dist/$NAME/$f"
                      fi
                  done
                  tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
                  (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
                  gh release upload "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256"
